
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FoodBridge | Donor Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard { max-width: 1000px; margin: 45px auto; padding: 20px; }
        .dash-card { background: white; padding: 24px; border-radius: 14px; margin: 20px 0; }
        .dash-card input { display:block; width:100%; padding:12px; margin:10px 0 16px; box-sizing:border-box; }
        .dash-card button, .logout { padding:12px 18px; cursor:pointer; }
        .dash-list { display:grid; gap:12px; }
        .food-item { background:#f0f7f3; padding:16px; border-radius:10px; }
        #notice { white-space:pre-wrap; }
    </style>
</head>
<body>
<header class="header">
    <nav class="container nav">
        <a class="brand" href="index.html">FoodBridge</a>
        <button class="logout" id="logoutButton">Logout</button>
    </nav>
</header>

<main class="dashboard">
    <h1>Donor Dashboard</h1>
    <p id="welcome">Checking your account...</p>
    <p id="notice" role="status"></p>

    <section class="dash-card">
        <h2>List Food Donation</h2>
        <form id="donationForm">
            <label for="food">Food description</label>
            <input id="food" required maxlength="200" placeholder="e.g. Fresh meals">

            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" required min="1" max="100000"
                   placeholder="Number of servings">

            <label for="location">Pickup location</label>
            <input id="location" required maxlength="300" placeholder="Pickup address">

            <button type="submit">Submit Donation</button>
        </form>
    </section>

    <section class="dash-card">
        <h2>Community Donations</h2>
        <button id="refreshButton" type="button">Refresh</button>
        <div id="donations" class="dash-list"></div>
    </section>
</main>

<script>
const notice = document.getElementById("notice");

async function request(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
            ...(options.headers || {}),
            ...(options.body ? {"Content-Type":"application/json"} : {})
        }
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    return data;
}

function showError(error) {
    notice.textContent = error.message;
}

async function checkUser() {
    try {
        const user = await request("/api/me");
        if (user.role !== "DONOR") {
            window.location.replace(
                user.role === "RECEIVER" ? "receiver.html" : "auth.html"
            );
            return false;
        }
        document.getElementById("welcome").textContent =
            "Welcome, " + user.fullName + "!";
        document.getElementById("food").dataset.donor = user.fullName;
        return true;
    } catch (error) {
        window.location.replace("auth.html");
        return false;
    }
}

async function loadDonations() {
    try {
        const donations = await request("/api/donations");
        const list = document.getElementById("donations");
        list.replaceChildren();

        if (!donations.length) {
            list.textContent = "No donations listed yet.";
            return;
        }

        donations.forEach(d => {
            const item = document.createElement("div");
            item.className = "food-item";
            const title = document.createElement("strong");
            title.textContent = d.food;
            const details = document.createElement("p");
            details.textContent =
                "Donor: " + d.donor + " | Quantity: " + d.quantity +
                " | Location: " + d.location + " | Status: " + d.status;
            item.append(title, details);
            list.appendChild(item);
        });
    } catch (error) {
        showError(error);
    }
}

document.getElementById("donationForm").addEventListener("submit", async e => {
    e.preventDefault();
    try {
        const user = await request("/api/me");
        if (user.role !== "DONOR") throw new Error("Donor account required.");

        await request("/api/donations", {
            method: "POST",
            body: JSON.stringify({
                donor: user.fullName,
                food: document.getElementById("food").value.trim(),
                quantity: Number(document.getElementById("quantity").value),
                location: document.getElementById("location").value.trim()
            })
        });

        notice.textContent = "Donation added successfully!";
        e.target.reset();
        await loadDonations();
    } catch (error) {
        showError(error);
    }
});

document.getElementById("refreshButton").addEventListener("click", loadDonations);

document.getElementById("logoutButton").addEventListener("click", async () => {
    try {
        await request("/api/logout", {method:"POST"});
    } finally {
        window.location.replace("auth.html");
    }
});

(async () => {
    if (await checkUser()) await loadDonations();
})();
</script>
</body>
</html>
