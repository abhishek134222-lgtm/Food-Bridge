<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#167451">
    <title>FoodBridge | Login & Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 980px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .auth-header h1 {
            font-size: clamp(30px, 4vw, 42px);
            margin: 10px 0 8px;
            letter-spacing: -1px;
        }
        .auth-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        .auth-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(22, 62, 39, 0.04);
        }
        .auth-card h2 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .auth-card p.subtitle {
            margin: 0 0 22px;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-form {
            display: grid;
            gap: 16px;
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }
        .role-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
            color: var(--text);
            transition: all 0.2s;
        }
        .role-option input {
            display: none;
        }
        .role-option.active {
            border-color: var(--green);
            background: var(--green-light);
            color: var(--green-dark);
        }
        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-box.error {
            display: block;
            background: #ffebeb;
            color: #a62d2d;
            border: 1px solid #f5c2c2;
        }
        .alert-box.success {
            display: block;
            background: #e5f5e9;
            color: #176b40;
            border: 1px solid #bce8c5;
        }
        @media (max-width: 768px) {
            .auth-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <a class="brand" href="index.html" aria-label="FoodBridge home">
                <span class="brand-icon">FB</span>
                <span>Food<span class="brand-accent">Bridge</span></span>
            </a>
            <div class="nav-links">
                <a href="index.html">← Back to Home</a>
            </div>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-header">
            <span class="eyebrow"><span class="live-dot"></span> SECURE ACCESS</span>
            <h1>Join the FoodBridge Mission</h1>
            <p class="muted">Connect with local communities to share food and eliminate waste.</p>
        </div>

        <div id="globalAlert" class="alert-box" role="status" aria-live="polite"></div>

        <div class="auth-grid">
            <!-- LOGIN CARD -->
            <section class="auth-card">
                <h2>Welcome Back</h2>
                <p class="subtitle">Log in to manage your donations or claims.</p>

                <form id="loginForm" class="auth-form">
                    <div class="form-field">
                        <label for="loginEmail">Email Address</label>
                        <input id="loginEmail" name="email" type="email" required
                               autocomplete="username" placeholder="you@example.com">
                    </div>

                    <div class="form-field">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" name="password" type="password" required
                               autocomplete="current-password" placeholder="Enter your password">
                    </div>

                    <button id="loginButton" type="submit" class="button button-primary">
                        Sign In →
                    </button>
                </form>
            </section>

            <!-- REGISTER CARD -->
            <section class="auth-card">
                <h2>Create an Account</h2>
                <p class="subtitle">Join as a food donor or authorized receiver.</p>

                <form id="registerForm" class="auth-form">
                    <div class="form-field">
                        <label for="fullName">Full Name</label>
                        <input id="fullName" name="fullName" type="text" required maxlength="100"
                               autocomplete="name" placeholder="e.g. Sarah Jenkins">
                    </div>

                    <div class="form-field">
                        <label for="regEmail">Email Address</label>
                        <input id="regEmail" name="email" type="email" required maxlength="255"
                               autocomplete="email" placeholder="you@example.com">
                    </div>

                    <div class="form-field">
                        <label for="regPassword">Password</label>
                        <input id="regPassword" name="password" type="password" required minlength="8"
                               autocomplete="new-password" placeholder="At least 8 characters">
                    </div>

                    <div class="form-field">
                        <label>Register As</label>
                        <div class="role-selector">
                            <label class="role-option active" id="donorOption">
                                <input type="radio" name="role" value="DONOR" checked>
                                <span>♡ Food Donor</span>
                            </label>
                            <label class="role-option" id="receiverOption">
                                <input type="radio" name="role" value="RECEIVER">
                                <span>♧ Food Receiver</span>
                            </label>
                        </div>
                    </div>

                    <button id="registerButton" type="submit" class="button button-primary">
                        Create Account →
                    </button>
                </form>
            </section>
        </div>
    </main>

    <script>
        const alertBox = document.getElementById("globalAlert");

        function showAlert(text, type = "error") {
            alertBox.textContent = text;
            alertBox.className = "alert-box " + type;
            alertBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        // Role option styling toggle
        const donorOption = document.getElementById("donorOption");
        const receiverOption = document.getElementById("receiverOption");

        donorOption.addEventListener("click", () => {
            donorOption.classList.add("active");
            receiverOption.classList.remove("active");
        });

        receiverOption.addEventListener("click", () => {
            receiverOption.classList.add("active");
            donorOption.classList.remove("active");
        });

        async function submitAuth(url, payload, buttonId) {
            const btn = document.getElementById(buttonId);
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = "Verifying...";
            alertBox.className = "alert-box";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.error || "Authentication failed. Please check your credentials.");
                }

                showAlert(`Welcome, ${data.fullName || "Friend"}! Redirecting...`, "success");

                setTimeout(() => {
                    if (data.role === "DONOR") {
                        window.location.href = "donor.html";
                    } else if (data.role === "RECEIVER") {
                        window.location.href = "receiver.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 900);

            } catch (err) {
                showAlert(err.message === "Failed to fetch" ? "Cannot connect to server. Is the Java backend running?" : err.message, "error");
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            submitAuth("/api/login", {
                email: document.getElementById("loginEmail").value.trim(),
                password: document.getElementById("loginPassword").value
            }, "loginButton");
        });

        document.getElementById("registerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const selectedRole = document.querySelector('input[name="role"]:checked')?.value || "DONOR";
            submitAuth("/api/register", {
                fullName: document.getElementById("fullName").value.trim(),
                email: document.getElementById("regEmail").value.trim(),
                password: document.getElementById("regPassword").value,
                role: selectedRole
            }, "registerButton");
        });
    </script>
</body>
</html>
